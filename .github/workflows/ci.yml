name: Validate Yamnaya
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
  camps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: docker compose --env-file .env.camps up -d --build
      - run: docker compose --env-file .env.camps exec -T -e CAMP_HERMES_SUPERVISOR_URL=http://127.0.0.1:8765 hermes python /opt/yamnaya/test-hermes.py
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camp-browser-evidence
          path: |
            playwright-report/camps
            test-results
            runtime/screenshots
