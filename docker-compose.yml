name: yamnaya-camps
services:
  postgres:
    image: postgres:17-alpine
    environment:
      { POSTGRES_USER: camps, POSTGRES_PASSWORD: camps, POSTGRES_DB: camps }
    volumes: [camp-postgres:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5545:5432"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U camps"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [application, public]
    restart: unless-stopped
  migrate:
    build: { context: ., dockerfile: Dockerfile.app, target: worker }
    command: [node_modules/.bin/tsx, scripts/camps/migrate.ts]
    environment:
      { CAMP_DATABASE_URL: "postgres://camps:camps@postgres:5432/camps" }
    depends_on: { postgres: { condition: service_healthy } }
    networks: [application, public]
  web:
    build: { context: ., dockerfile: Dockerfile.app, target: web }
    environment:
      CAMP_STORAGE: postgres
      CAMP_DATABASE_URL: postgres://camps:camps@postgres:5432/camps
      CAMP_OPERATOR_ID: ${CAMP_OPERATOR_ID:-operator}
      CAMP_OPERATOR_PASSWORD: ${CAMP_OPERATOR_PASSWORD:?Run camps:setup}
      CAMP_SESSION_SECRET: ${CAMP_SESSION_SECRET:?Run camps:setup}
      CAMP_WORKER_TOKEN: ${CAMP_WORKER_TOKEN:?Run camps:setup}
      CAMP_SLACK_OPERATOR_IDS: ${CAMP_SLACK_OPERATOR_IDS:-}
      CAMP_PUBLIC_URL: ${CAMP_PUBLIC_URL:-http://localhost:3110}
      HOSTNAME: 0.0.0.0
      PORT: "3110"
    ports: ["127.0.0.1:3110:3110"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    networks: [application, public]
    restart: unless-stopped
  worker:
    build: { context: ., dockerfile: Dockerfile.app, target: worker }
    command: [node_modules/.bin/tsx, services/worker/camps.ts]
    env_file: .env.camps
    environment:
      CAMP_API_URL: http://web:3110
      CAMP_HERMES_URL: http://hermes:8765
      CAMP_SANDBOX_URL: http://sandbox:4111
      CAMP_BROWSER_URL: http://browser:4113
      CAMP_MODEL_PROXY_URL: http://worker:4112/v1
      CAMP_GATEWAY_HOST: 0.0.0.0
      CAMP_ARTIFACT_DIR: /app/runtime/artifacts
    ports: ["127.0.0.1:4112:4112"]
    volumes: [camp-artifacts:/app/runtime]
    depends_on: [web, hermes, sandbox, browser]
    networks: [application, runtime, execution, browsing, public]
    restart: unless-stopped
  hermes:
    build: { context: ., dockerfile: services/hermes/Dockerfile }
    environment:
      { CAMP_RUNTIME_SECRET: "${CAMP_RUNTIME_SECRET:?Run camps:setup}" }
    volumes: [camp-hermes:/data]
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=256m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 3g
    pids_limit: 128
    networks: [runtime, application]
    restart: unless-stopped
  sandbox:
    build: { context: ., dockerfile: Dockerfile.app, target: camp-sandbox }
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=1g"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
    networks: [execution]
    restart: unless-stopped
  browser:
    build: { context: ., dockerfile: Dockerfile.app, target: camp-browser }
    read_only: true
    tmpfs: ["/tmp:rw,nosuid,size=512m", "/home/node/.cache:rw,nosuid,size=32m"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    networks: [browsing, public]
    restart: unless-stopped
networks:
  application: { internal: true }
  runtime: { internal: true }
  execution: { internal: true }
  browsing: { internal: true }
  public: {}
volumes:
  camp-postgres:
  camp-hermes:
  camp-artifacts:
